# Render Blueprint for Nova Hymnal Backend
# This file can be used to deploy to Render.com

services:
  - type: web
    name: nova-hymnal-backend
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    # Django WSGI (not Flask's app:app). Bind to Render's PORT.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DEBUG
        value: "False"
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: nova-hymn-backend.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nova-hymn-backend.onrender.com,http://localhost:3000
      - key: DB_NAME
        fromDatabase:
          name: nova-hymnal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: nova-hymnal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nova-hymnal-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: nova-hymnal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nova-hymnal-db
          property: port
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PREMIUM_MONTHLY_AMOUNT
        value: "50"
      - key: PREMIUM_YEARLY_AMOUNT
        value: "500"
      - key: PREMIUM_CURRENCY
        value: GHS

databases:
  - name: nova-hymnal-db
    plan: starter
    databaseName: neondb
    user: neondb_owner



